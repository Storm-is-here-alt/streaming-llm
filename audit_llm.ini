[resources]
max_ram_mb = 512
weight_window_mb = 64
threads = 4

[memory]
log_path = ./chat.dat
index_path = ./chat.idx
chunk_tokens = 128
never_prune = true
never_truncate = true
max_feed_tokens = 4096

[bayesian]
top_k = 32
accept_threshold = 0.35
reject_threshold = 0.12
recency_half_life_h = 24.0
bm25_k1 = 1.2
bm25_b = 0.75
w_bm25 = 0.5
w_recency = 0.2
w_importance = 0.2
w_reward = 0.1
audit_enabled = true

[inference]
layers = 32
hidden_dim = 4096
mtp_k = 4
mtp_verify = true
moe_top_n = 2
ssm_decay = 0.9

[healing]
learning_rate = 0.05
auto_tune = true
